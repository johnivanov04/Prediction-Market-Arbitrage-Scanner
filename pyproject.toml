[project]
name = "predarb"
version = "0.1.0"
description = "Prediction-market arbitrage and mispricing research system (Phase 1: Kalshi, read-only)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Phase 1 is read-only research. There is deliberately no order-submission
# dependency (no brokerage/execution SDK) anywhere in this list.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "websockets>=13.0",
    "structlog>=24.4",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "polars>=1.9",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "typer>=0.12",
    "cryptography>=43.0",
]

[project.scripts]
predarb = "predarb.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predarb"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "A",           # builtins shadowing
    "C4",          # comprehensions
    "DTZ",         # flake8-datetimez -- naive datetimes are a correctness bug here
    "T20",         # no print()
    "SIM",         # simplify
    "RUF",         # ruff-specific
    "PL",          # pylint
    "TRY",         # tryceratops
    "ARG",         # unused arguments
    "PTH",         # use pathlib
    "ANN",         # type annotations required
]
ignore = [
    "ANN401",  # Any is occasionally required at venue-payload boundaries
    "TRY003",  # long messages in raises are wanted here; they are audit output
    "PLR0913", # opportunity/audit records legitimately take many fields
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "S101"]
# tools/ are operator-run scripts: stdout is their interface, and a linear
# top-to-bottom procedure is clearer than decomposing for its own sake.
"tools/**" = ["T20", "PLR0912", "PLR0915", "PLR2004"]

[tool.ruff.lint.flake8-builtins]
builtins-allowed-modules = ["logging"]

[tool.ruff.lint.isort]
known-first-party = ["predarb"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy  (Pyright config lives in pyrightconfig.json; either may be used)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    # Live tests contact the real Kalshi API and are excluded by default.
    # Run them deliberately with: uv run pytest -m live
    "-m",
    "not live",
]
markers = [
    "unit: fast, hermetic, no network and no database",
    "property: Hypothesis-driven property tests",
    "integration: requires Postgres or recorded fixtures (never the live venue)",
    "live: touches the real Kalshi API; skipped unless PREDARB_ALLOW_LIVE_TESTS=1",
]
asyncio_mode = "auto"
filterwarnings = ["error"]
